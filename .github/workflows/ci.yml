name: CI

on:
  push:
    branches: [main, 'legacy/**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify tracked bundles
        run: git diff --exit-code -- panel/main.js service/main.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: mlx-scope-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 7
          if-no-files-found: error

  release-sync:
    # Git installs follow `#release`, which only moves when a tag is published. This surfaces the drift when main
    # carries a version that was never tagged, so the release branch and Git installs do not silently lag.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Compare main's version with the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -e 'console.log(require("./package.json").version)')
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$tag" != "v$version" ]; then
            echo "::warning::main is at $version but the newest published release is $tag. Tag v$version from main so the release branch and Git installs catch up."
          fi

  browser:
    # Scope is a macOS extension, so the browser suite runs against the WebKit build users actually get.
    # The Linux runner used a different engine build and failed geometry checks that pass on macOS.
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify tracked bundles after build
        run: git diff --exit-code -- panel/main.js panel/style.css service/main.js package.json bun.lock
      - run: bunx playwright install --with-deps ${{ matrix.engine }}
      - name: Browser source provenance
        run: |
          git show -s --format='checkout_commit=%H%ncheckout_tree=%T' HEAD
          shasum -a 256 panel/main.js panel/style.css service/main.js package.json bun.lock
          node --version
          bun --version
      - run: bun run test:browser --project=${{ matrix.engine }} --workers=2
      - name: Verify tracked bundles after browser tests
        if: always()
        run: git diff --exit-code -- panel/main.js panel/style.css service/main.js package.json bun.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.engine }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
