<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>MLX Scope · 2.0 fixture host</title><style>html,body{margin:0;background:#10151b;font:11px -apple-system,sans-serif}aside{height:24px;display:grid;place-items:center;background:#203044;color:#c4d6e9}iframe{display:block;width:100%;height:calc(100vh - 24px);border:0}iframe.status{width:280px;height:120px;margin:0}</style></head>
<body><aside>2.0 fixture host · approved mock states · no connection to your runtime</aside><iframe title="MLX Scope" sandbox="allow-scripts"></iframe><script src="/v2-states.js"></script><script src="/media-fixtures.js"></script><script>
// Emulates OpenChamber 2.0.4 for the 2.0 panel: surfaces panel/page/status, setHeight (clamped 24–320 on status),

  for (const key of Object.keys(sessionStorage)) if (key.startsWith(demoPrefix)) sessionStorage.removeItem(key);

window.setPreviewFrameHidden = value => { frame.style.display = value ? 'none' : ''; };

window.previewOpenedSurfaces = [];

window.setPreviewPatch = value => { window.previewPatch = value; };
const chats = { local: { id: 'fixture-chat', title: 'Fixture chat', busy: true, model: 'omlx/Example-27B-4bit' },

let session = chats[params.get('chat')] ?? null;

  const palette = name === 'graphite-mint' ? ['#141819','#1d2325','#97dbc2','#97dbc2','#14271f']
    : name === 'warm-amber' ? ['#f8f5ee','#fffdf8','#855827','#855827','#ffffff']
    : light ? ['#f7f9fb','#ffffff','#245a90','#2868a5','#ffffff'] : ['#10151b','#202c36','#98c8fa','#3b72ad','#ffffff'];
  const result = {mode:light?'light':'dark',tokens:{
    background:palette[0],elevated:palette[1],foreground:light?'#172a37':'#e9f0f5',elevatedForeground:light?'#172a37':'#e9f0f5',
    muted:light?'#596977':'#9aa9b7',subtle:light?'#687683':'#8595a5',border:light?'#ced7df':'#3b3a47',
    hover:light?'#e8e4de':'#2c2736',active:light?'#e1ddd7':'#342e40',selection:light?'#dfd4c4':'#433653',selectionForeground:light?'#172a37':'#e9f0f5',
    focus:palette[2],mutedSurface:light?'#f0ece6':'#25222d',primary:palette[3],primaryText:palette[2],primaryForeground:palette[4],
    success:light?'#197e68':'#7dd9bd',successText:light?'#197e68':'#7dd9bd',warning:light?'#966113':'#dfb976',warningText:light?'#966113':'#dfb976',
    error:light?'#b13a45':'#ee8992',errorText:light?'#b13a45':'#ee8992',info:light?'#286cae':'#86b7ed',infoText:light?'#286cae':'#86b7ed',
    font:'-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',mono:'ui-monospace, SFMono-Regular, Menlo, monospace',radius:'9px'}};
  if (name === 'graphite-mint') Object.assign(result.tokens, {foreground:'#e9efec',elevatedForeground:'#e9efec',muted:'#a4b2ad',subtle:'#8e9d97',
    border:'#3a4641',hover:'#26322c',active:'#304238',selection:'#304238',selectionForeground:'#e9efec',mutedSurface:'#202927'});
  if (name === 'warm-amber') Object.assign(result.tokens, {foreground:'#302b22',elevatedForeground:'#302b22',muted:'#706658',subtle:'#7c7164',
    border:'#d9cfbe',hover:'#eee8da',active:'#e8dec9',selection:'#e8dec9',selectionForeground:'#302b22',mutedSurface:'#eee8dc'});
  if (name === 'obsidian') Object.assign(result.tokens, {background:'#080808',elevated:'#111111',foreground:'#ededed',elevatedForeground:'#ededed',
    muted:'#a3a3a6',subtle:'#969699',border:'#303033',hover:'#222222',active:'#292929',selection:'#333333',selectionForeground:'#ededed',
    mutedSurface:'#161616',primary:'#bcbcc0',primaryText:'#dedee2',primaryForeground:'#080808',focus:'#dedee2',warning:'#efb53a',warningText:'#efb53a'});

let themeName = params.get('theme') || (demo ? 'graphite-mint' : 'dark');
document.documentElement.style.background = document.body.style.background = theme(themeName).tokens.background;
const post = message => frame.contentWindow.postMessage({channel:'openchamber.sdk',v:1,...message}, '*');

window.setPreviewTheme = value => { themeName = value; document.documentElement.style.background = document.body.style.background = theme(value).tokens.background; ready(); };
if (demo) {
  document.title = 'MLX Scope · Design preview';
  document.body.className = 'demo'; document.body.dataset.previewSurface = surface;
  document.querySelector('aside').textContent = 'Design preview · Synthetic readings · No runtime connection';
  const style = document.createElement('style');
  style.textContent = `body.demo{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden;color:var(--preview-fg)}
    body.demo aside{height:auto;min-height:24px;box-sizing:border-box;padding:5px 16px;font-size:10px;letter-spacing:.04em;background:var(--preview-bar);color:var(--preview-muted)}
    .demo-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--preview-bg);border-bottom:1px solid var(--preview-border);font-size:12px}
    .demo-toolbar label{display:flex;align-items:center;gap:8px;color:var(--preview-muted)}
    .demo-toolbar select{font:inherit;padding:5px 26px 5px 8px;color:var(--preview-fg);background:var(--preview-bar);border:1px solid var(--preview-border);border-radius:6px}
    .demo-toolbar nav{display:flex;gap:6px;flex-wrap:wrap}.demo-toolbar a{color:var(--preview-muted);text-decoration:none;padding:6px 9px;border-radius:6px}
    .demo-toolbar a[aria-current=page]{background:var(--preview-bar);color:var(--preview-fg)}
    .demo-toolbar a:focus-visible,.demo-toolbar select:focus-visible{outline:2px solid var(--preview-accent);outline-offset:2px}
    body.demo iframe{height:100%;min-height:0}body.demo[data-preview-surface=panel] iframe{width:min(100%,430px);justify-self:center}
    .preview-session{justify-self:center;align-self:start;width:min(330px,100%);box-sizing:border-box;margin:24px 0;padding:0 14px;border:1px solid var(--preview-border);border-radius:12px;background:var(--preview-bg);font-size:12px}
    .preview-session>header{padding:14px 0;font-weight:600;border-bottom:1px solid var(--preview-border)}
    .preview-session>.preview-row{display:flex;justify-content:space-between;padding:14px 0;color:var(--preview-muted)}
    .preview-session>h2{font:600 12px -apple-system,sans-serif;padding:14px 0 8px;margin:0;border-top:1px solid var(--preview-border)}
    body.demo .preview-session iframe{width:100%;margin:0}
    .preview-session>footer{padding:14px 0;border-top:1px solid var(--preview-border);color:var(--preview-muted)}
    @media(max-width:540px){.demo-toolbar{align-items:flex-start;padding:10px 12px;flex-direction:column;gap:8px}}`;
  document.head.append(style);
  const toolbar = document.createElement('div'); toolbar.className = 'demo-toolbar';
  toolbar.innerHTML = '<label>Preview theme <select aria-label="Preview theme"><option value="obsidian">Obsidian</option><option value="graphite-mint">Graphite · Mint</option><option value="warm-amber">Warm · Amber</option><option value="dark">OpenChamber dark fixture</option><option value="light">OpenChamber light fixture</option></select></label><nav aria-label="Preview surface"><a data-surface="page">Full page</a><a data-surface="panel">430px panel</a><a data-surface="status">Session widget</a></nav>';
  frame.before(toolbar);
  const select = toolbar.querySelector('select'); select.value = themeName;
  const paintPreview = () => {
    const current = theme(themeName), tokens = current.tokens;
    document.body.style.colorScheme = current.mode;
    for (const [role,key] of Object.entries({bg:'background',bar:'elevated',fg:'foreground',muted:'muted',border:'border',accent:'primaryText'})) document.body.style.setProperty('--preview-' + role, tokens[key]);
    for (const link of toolbar.querySelectorAll('a')) {
      const next = new URLSearchParams(params); next.set('demo','1'); next.set('theme',select.value); next.set('surface',link.dataset.surface);
      link.href = '/v2?' + next.toString(); if (link.dataset.surface === surface) link.setAttribute('aria-current','page');
    }
  };
  select.addEventListener('change', () => {
    window.setPreviewTheme(select.value); paintPreview();
    const next = new URL(location.href); next.searchParams.set('theme',select.value); history.replaceState(null,'',next);
  });
  paintPreview();
  if (surface === 'status') {
    const session = document.createElement('section'); session.className = 'preview-session';
    session.setAttribute('aria-label', 'Session pane preview');
    session.innerHTML = '<header>Session</header><div class="preview-row"><span>Usage</span><span>⌄</span></div><h2>MLX Scope</h2>';
    frame.before(session); session.append(frame);
    const footer = document.createElement('footer'); footer.textContent = 'Context sources'; session.append(footer);
  }
}
window.setPreviewSession = value => { session = value; post({type:'session',payload:{session:value}}); };
window.sendPreviewLifecycle = (phase) => post({type:'session-lifecycle',payload:{sessionId:'fixture-chat',phase}});
const result = (id, payload = null) => post({type:'result',id,ok:true,payload});
const failure = (id, code, error) => post({type:'result',id,ok:false,code,error});
window.addEventListener('message', event => {
  if (event.source !== frame.contentWindow || event.data?.channel !== 'openchamber.sdk') return;
  const m = event.data;
  if (m.type === 'hello') { if (!params.has('nohost')) ready(); return; }
  if (m.type === 'resize') { window.previewHeights.push(m.payload.height); if (surface === 'status') frame.style.height = `${Math.min(320, Math.max(24, m.payload.height))}px`; result(m.id); return; }
  if (m.type === 'badge') { window.previewBadges.push(m.payload.count); result(m.id); return; }
  if (m.type === 'toast') { window.previewToasts.push(m.payload); result(m.id); return; }
  if (m.type === 'open-url') { window.previewOpenedURL = m.payload.url; result(m.id); return; }
  if (m.type === 'open-surface') {
    window.previewOpenedSurfaces.push(m.payload.surfaceId);
    if (params.get('openSurface') === 'fail') failure(m.id, 'HOST_REJECTED', 'Fixture surface unavailable');
    else if (params.get('openSurface') === 'defer') (window.previewSurfaceDeferred ??= []).push(() => failure(m.id, 'HOST_REJECTED', 'Fixture delayed surface failure'));

    return;
  }
  if (m.type === 'service-status') { result(m.id, {status:'ready'}); return; }
  if (m.type === 'clipboard-write') { window.previewCopied = m.payload.text; result(m.id); return; }
  if (m.type === 'compose') { window.previewComposed = m.payload; result(m.id); return; }
  if (m.type === 'storage') {
    const {op,key,value} = m.payload, storedKey = demo ? demoPrefix + key : key, stored = key ? sessionStorage.getItem(storedKey) : null;
    if (params.get('storage') === 'fail') { failure(m.id, 'HOST_REJECTED', 'Fixture storage failure'); return; }
    if (op === 'delete') { sessionStorage.removeItem(storedKey); window.previewWrites += 1; }
    if (op === 'set') { sessionStorage.setItem(storedKey, JSON.stringify(value)); window.previewWrites += 1; }
    const keys = Object.keys(sessionStorage).filter(key => demo ? key.startsWith(demoPrefix) : !key.startsWith(demoPrefix)).map(key => demo ? key.slice(demoPrefix.length) : key);
    result(m.id, op === 'keys' ? {storage:true,op,keys} : op === 'get' ? {storage:true,op,found:stored !== null,...(stored === null ? {} : {value:JSON.parse(stored)})} : {storage:true,op});
    return;
  }
  if (m.type === 'prompt' || m.type === 'generate' || m.type === 'start-session') { window.previewUnexpectedSends += 1; return; }
  if (m.type !== 'service-request') return;
  window.previewAllRequests = (window.previewAllRequests || 0) + 1;
  const auxiliary = window.ScopeMediaFixtures?.respond(m);
  if (auxiliary) {
    if (window.previewHold || (m.payload.path === '/v2/media' && window.previewMediaHold)) return;
    if (window.previewError || window.previewTransportError || state === 'needs-approval') { post({type:'result',id:m.id,ok:false,code:window.previewError || window.previewTransportError || 'NO_SERVICE',error:'Fixture host unavailable'}); return; }
    post({type:'result',id:m.id,ok:true,payload:auxiliary}); return;
  }
  const query = m.payload.query || {};
  window.previewQueries.push(query); window.previewRequests += 1;
  if (window.previewHold) return;
  const approval = state === 'needs-approval' || window.previewError === 'NO_SERVICE';
  if (approval || window.previewError) { failure(m.id, approval ? 'NO_SERVICE' : window.previewError, 'NO_SERVICE: Allow this extension’s local service in Settings → Extensions.'); return; }

    result(m.id, {status:200,body:JSON.stringify(body)}); return;
  }
  const mismatch = state === 'contract-mismatch' || m.payload.path !== '/v2/snapshot';
  const since = /^\d+$/.test(query.since ?? '') ? Number(query.since) : undefined;

</script></body></html>
