<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLX Scope 2.0 mock</title>
<style>
/* MLX Scope 2.0 · G2 design mock. Static and self-contained: synthetic v2 fixtures, no network, no external assets.
   Query: surface=board|rail|page|status · tab=live|server|history|captures · state=<fixture state> · variant=<status variant>
   · theme=dark|light · pop=attr|reply|mac|thermal · details=open · labels=short · compact=1.
   Sections marked "1.6" are panel/style.css with IDs turned into classes; "2.0" is the proposal. */

/* ---------- Host tokens, as the synthetic preview host sets them (tests/browser/host.html) ---------- */
:root {
  --oc-bg: #10151b; --oc-elevated: #202c36; --oc-fg: #e9f0f5; --oc-muted: #9aa9b7; --oc-subtle: #8595a5; --oc-border: #3b3a47;
  --oc-hover: #2c2736; --oc-muted-surface: #25222d; --oc-primary: #3b72ad; --oc-primary-text: #98c8fa; --oc-primary-fg: #ffffff;
  --oc-success-text: #7dd9bd; --oc-warning-text: #dfb976; --oc-error-text: #ee8992; --oc-info-text: #86b7ed;
  --oc-font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --oc-mono: ui-monospace, SFMono-Regular, Menlo, monospace; --oc-radius: 9px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --oc-bg: #f7f9fb; --oc-elevated: #ffffff; --oc-fg: #172a37; --oc-muted: #596977; --oc-subtle: #687683; --oc-border: #ced7df;
  --oc-hover: #e8e4de; --oc-muted-surface: #f0ece6; --oc-primary: #2868a5; --oc-primary-text: #245a90; --oc-primary-fg: #ffffff;
  --oc-success-text: #197e68; --oc-warning-text: #966113; --oc-error-text: #b13a45; --oc-info-text: #286cae;
  color-scheme: light;
}

/* ---------- 1.6 tokens (panel/style.css:7-29, unchanged) ---------- */
:root {
  --scope-fg: var(--oc-fg, #ecf2f7);
  --scope-muted: var(--oc-muted, #9aa9b7);
  --scope-bg: var(--oc-bg, #0f151b);
  --scope-fill: var(--oc-primary, #377dbd);
  --scope-on-fill: var(--oc-primary-fg, #ffffff);
  --scope-blue: var(--oc-info-text, #88b9ee);
  --scope-good: var(--oc-success-text, #79cfb7);
  --scope-warn: var(--oc-warning-text, #c99646);
  --scope-accent: var(--oc-primary-text, #88b9ee);
  --scope-line: color-mix(in srgb, var(--oc-border, #29313a) 70%, transparent);
  --scope-line-strong: var(--oc-border, #29313a);
  --scope-surface: color-mix(in srgb, var(--oc-muted-surface, #192128) 55%, var(--scope-bg));
  --scope-surface-2: color-mix(in srgb, var(--oc-muted-surface, #192128) 85%, var(--scope-bg));
  --scope-radius: var(--oc-radius, 9px);
  --scope-card-radius: calc(var(--oc-radius, 9px) + 3px);
  --scope-mono: var(--oc-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  font-family: var(--oc-font, -apple-system, BlinkMacSystemFont, sans-serif);
  color: var(--scope-fg);
  background: var(--scope-bg);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
/* 2.0 proposal: the one token addition, derived from a host token like the rest. Used only for critical alerts and offline. */
:root { --scope-bad: var(--oc-error-text, #ee8992); }

/* ---------- 1.6 base ---------- */
* { box-sizing: border-box; }
body { margin: 0; background: var(--scope-bg); }
h1, h2, h3, p, figure, dl, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
[hidden] { display: none !important; }
button, summary { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--scope-accent); outline-offset: 3px; }
[role="tabpanel"]:focus-visible { outline: 2px solid var(--scope-accent); outline-offset: 4px; border-radius: 4px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
.scope[data-phase="prefill"] { --scope-accent: var(--scope-blue); }
.scope:is([data-phase="queued"], [data-phase="reconnecting"], [data-stale="true"]) { --scope-accent: var(--scope-warn); }
.scope[data-paused="true"] { --scope-accent: var(--scope-muted); }

/* ---------- 1.6 shell ---------- */
.scope { max-width: 760px; margin: auto; padding: 16px 16px 20px; font-size: 12px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.masthead, .brand, .chart-top, figcaption, .section-heading, footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.section-heading h2, .section-heading h3 { flex: none; font-size: 12px; font-weight: 600; letter-spacing: -.005em; white-space: nowrap; }
.section-heading > span { min-width: 0; color: var(--scope-muted); font-size: 11px; text-align: right; }
.insight-note { margin-top: 6px; color: var(--scope-muted); font-size: 11px; line-height: 1.6; }
.meter, .progress-track { overflow: hidden; height: 4px; border-radius: 999px; background: color-mix(in srgb, var(--scope-muted) 18%, transparent); }
.meter i, .progress-track span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--scope-accent); }
.hero-card, .machine, .insight-section, .capture-card, .approval-card {
  border: 1px solid var(--scope-line); border-radius: var(--scope-card-radius); background: var(--scope-surface);
}
.masthead { justify-content: flex-start; min-height: 32px; }
.brand { flex: none; justify-content: flex-start; gap: 8px; }
.scope-mark { width: 20px; height: 20px; fill: none; stroke: var(--scope-accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.scope-mark circle { opacity: .4; }
h1 { font-size: 14px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; }
h1 span { font-weight: 400; color: var(--scope-muted); }
.status-pill { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 auto; margin-left: 4px; padding: 4px 10px; border: 1px solid var(--scope-line); border-radius: 999px; background: var(--scope-surface); color: var(--scope-muted); font-size: 11px; white-space: nowrap; overflow: hidden; }
.status-pill .phase { flex: none; color: var(--scope-fg); font-weight: 550; }
.status-pill .conn { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.status-sep { flex: none; opacity: .6; }
.connection-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--scope-good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--scope-good) 20%, transparent); }
.scope:is([data-stale="true"], [data-phase="reconnecting"]) .connection-dot { background: var(--scope-warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--scope-warn) 20%, transparent); }
.scope[data-phase="offline"] .connection-dot { background: var(--scope-bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--scope-bad) 20%, transparent); }
.scope:is([data-approval="true"], [data-paused="true"], [data-phase="detecting"]) .connection-dot { background: var(--scope-muted); box-shadow: none; }
.monitor-controls { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 1px solid var(--scope-line); border-radius: var(--scope-radius); background: transparent; color: var(--scope-fg); cursor: pointer; }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn svg circle { fill: currentColor; stroke: none; }
.workspace-nav { margin-top: 14px; }
.tablist { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; border: 1px solid var(--scope-line); border-radius: calc(var(--scope-radius) + 1px); background: var(--scope-surface); }
.tab { min-height: 28px; padding: 4px 10px; border: 0; border-radius: calc(var(--scope-radius) - 2px); background: transparent; color: var(--scope-muted); font: 500 12px var(--oc-font, sans-serif); white-space: nowrap; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--scope-fg); background: var(--scope-bg); box-shadow: 0 0 0 1px var(--scope-line), 0 1px 2px #0000001f; }
.view { display: grid; gap: 8px; align-content: start; margin-top: 16px; }
.link-btn { margin: 4px 0 0 -6px; padding: 3px 6px; border: 0; border-radius: var(--scope-radius); background: transparent; color: var(--oc-primary-text, var(--scope-accent)); font: inherit; cursor: pointer; white-space: nowrap; }
.notice { padding-left: 10px; border-left: 2px solid var(--scope-warn); color: var(--scope-muted); font-size: 11px; line-height: 1.6; }

/* 1.6's diagnosis callout is the one callout in 2.0: runtime status, alerts, tips. Only its tone follows severity. */
.connection-diagnosis { --tone: var(--scope-warn); margin-top: 12px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--tone) 30%, var(--scope-line)); border-radius: var(--scope-radius); background: color-mix(in srgb, var(--tone) 7%, var(--scope-bg)); color: var(--scope-fg); font-size: 11px; line-height: 1.6; }
.connection-diagnosis[data-severity="critical"] { --tone: var(--scope-bad); }
.connection-diagnosis[data-severity="info"] { --tone: var(--scope-blue); }
.view > .connection-diagnosis, .insight-section .connection-diagnosis { margin-top: 0; }
.insight-section .connection-diagnosis { margin-top: 10px; }
.diag-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; }
.diag-title strong { font-weight: 600; }
.diag-meta { color: var(--scope-muted); }
.connection-diagnosis .link-btn { margin: 2px 0 0 -6px; }
.diag-more { margin-top: 6px; }
.diag-more > li { padding-top: 6px; border-top: 1px solid color-mix(in srgb, var(--tone) 20%, var(--scope-line)); }

/* ---------- 1.6 hero card ---------- */
.hero-card { position: relative; padding: 16px; overflow: hidden; background: linear-gradient(180deg, color-mix(in srgb, var(--scope-accent) 7%, var(--scope-surface)), var(--scope-surface) 55%); border-color: color-mix(in srgb, var(--scope-accent) 22%, var(--scope-line)); }
.hero-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(90deg, var(--scope-accent), transparent 80%); opacity: .7; }
.model-name { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.4; letter-spacing: -.005em; white-space: nowrap; }
.model-name::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--scope-accent); }
.model-name span { overflow: hidden; text-overflow: ellipsis; }
.hero-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; min-width: 0; }
.hero-top .model-name { flex: 1 1 auto; }
.coverage-note { margin-top: 8px; max-width: 64ch; color: var(--scope-muted); font-size: 11px; line-height: 1.6; }
.hero-row { margin-top: 14px; }
.readout { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.rate { font-size: 52px; line-height: 1; font-weight: 500; letter-spacing: -.035em; }
.rate.is-word { font-size: 28px; font-weight: 500; letter-spacing: -.02em; }
.unit { max-width: 200px; color: var(--scope-muted); font-size: 11px; line-height: 1.45; }
.signal { position: relative; margin-top: 14px; }
.chart-top, figcaption { color: var(--scope-muted); font-size: 10px; }
.chart-top > span:last-child, figcaption { font-family: var(--scope-mono); }
.plot { position: relative; height: 76px; margin: 6px 0 4px; }
.plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.grid { fill: none; stroke: var(--scope-line); stroke-width: 1; stroke-dasharray: 2 4; vector-effect: non-scaling-stroke; }
.trace { fill: none; stroke: var(--scope-accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.trace-area { stroke: none; opacity: .22; fill: var(--scope-accent); }
.mark { stroke: var(--scope-muted); stroke-width: 1; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke; }
.prefill-progress { margin-top: 14px; }
.prefill-values { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
.prefill-remaining { font-size: 36px; line-height: 1.05; font-weight: 500; letter-spacing: -.03em; }
.prefill-completed { color: var(--scope-muted); font-size: 11px; }
.prefill-progress .progress-track { height: 8px; margin: 12px 0 8px; }
.prefill-estimate { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--scope-line); color: var(--scope-muted); font-size: 11px; }
.prefill-estimate strong { margin-left: auto; color: var(--scope-fg); font-size: 15px; font-weight: 600; }
.prefill-estimate .basis { width: 100%; }
.scope[data-phase="prefill"] .hero-row { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--scope-line); }
.scope[data-phase="prefill"] .rate { font-size: 26px; letter-spacing: -.02em; }
.context-headroom { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--scope-line); }
.context-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; color: var(--scope-muted); font-size: 11px; }
.context-line strong { color: var(--scope-fg); font-weight: 550; }
.context-headroom .meter { height: 6px; }
.context-headroom .meter i { background: color-mix(in srgb, var(--scope-accent) 80%, var(--scope-fg)); }
.context-headroom .pop { margin: 0 0 8px; }

/* ---------- 1.6 stat tiles ---------- */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.metrics > div { min-width: 0; padding: 10px 12px 12px; border: 1px solid var(--scope-line); border-radius: var(--scope-card-radius); background: var(--scope-surface); }
.metric-label { display: block; color: var(--scope-muted); font-size: 11px; }
.metrics strong { display: block; margin-top: 2px; font-size: 20px; font-weight: 550; letter-spacing: -.02em; line-height: 1.3; }
.metric-detail { display: block; margin-top: 1px; color: var(--scope-muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metrics .meter { margin-top: 8px; height: 3px; }
.metrics[data-count="3"] > div:last-child { grid-column: 1 / -1; }

/* ---------- 1.6 host card, 2.0 rows ---------- */
.machine { padding: 12px 14px 4px; }
.machine-title { font-size: 12px; font-weight: 600; }
.machine > .title-row { margin-bottom: 10px; }
.machine > .pop { margin: -2px 0 10px; }
.machine-line { display: grid; grid-template-columns: 1fr 1.3fr .8fr; gap: 12px; }
.machine-line > div { min-width: 0; }
.machine-label { display: block; color: var(--scope-muted); font-size: 11px; }
.machine-line strong { display: block; margin-top: 1px; font-size: 14px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.machine-line .meter { margin-top: 6px; height: 3px; }
.machine-line .meter i { background: var(--scope-blue); }
.machine-line > div:nth-child(2) .meter i { background: var(--scope-good); }
.host-details { margin-top: 2px; border-top: 1px solid var(--scope-line); }
.host-details > summary { display: flex; align-items: center; justify-content: space-between; min-height: 34px; color: var(--scope-muted); font-size: 11px; }
.host-details > summary::after { content: "›"; font-size: 14px; }
.host-details[open] > summary::after { transform: rotate(90deg); }
.mac-rows { margin-top: 10px; }
.mac-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 12px; padding: 7px 0; border-top: 1px solid var(--scope-line); font-size: 11px; }
.mac-row > span:first-child { min-width: 0; color: var(--scope-muted); overflow-wrap: anywhere; }
.mac-row > strong, .mac-row > .val { font-size: 12px; font-weight: 550; text-align: right; white-space: nowrap; }
.mac-row > .meter { grid-column: 1 / -1; height: 3px; margin: 4px 0 1px; }
.mac-row > .meter i { background: var(--scope-blue); }
.mac-row > .pop { grid-column: 1 / -1; margin-top: 4px; }
.host-details .mac-rows { margin-top: 0; padding-bottom: 6px; }
.level { display: inline-flex; align-items: center; gap: 6px; }
.level::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--scope-good); }
.level[data-level="warning"] { color: var(--scope-warn); }
.level[data-level="warning"]::before { background: var(--scope-warn); }
.level[data-level="critical"] { color: var(--scope-bad); }
.level[data-level="critical"]::before { background: var(--scope-bad); }

/* ---------- 1.6 Server cards ---------- */
.insight-section { min-width: 0; padding: 14px 16px; }
.values-2, .values-3 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.values-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
:is(.values-2, .values-3) > div { min-width: 0; }
:is(.values-2, .values-3) > div > span { display: block; color: var(--scope-muted); font-size: 11px; }
:is(.values-2, .values-3) strong { display: block; margin-top: 2px; font-size: 16px; font-weight: 550; white-space: nowrap; letter-spacing: -.01em; }
:is(.values-2, .values-3) small { display: block; color: var(--scope-muted); font-size: 10.5px; }
:is(.values-2, .values-3) strong .basis { display: inline; margin-left: 4px; }
.big-values strong { font-size: 22px; letter-spacing: -.02em; }
.big-values > div:first-child strong { color: var(--scope-accent); }
.cache-input-bar { height: 8px; margin: 12px 0 4px; overflow: hidden; border-radius: 999px; background: color-mix(in srgb, var(--scope-accent) 25%, transparent); }
.cache-input-bar > span { display: block; height: 100%; border-radius: inherit; background: var(--scope-accent); }
.resident-list { margin: 8px 0 4px; }
.resident-row { padding: 10px 0; border-top: 1px solid var(--scope-line); }
.resident-row:first-child { border-top: 0; }
.resident-heading, .resident-reading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.resident-heading strong { min-width: 0; font-size: 12px; font-weight: 500; overflow-wrap: anywhere; }
.resident-row[data-loaded="true"] .resident-heading strong { font-weight: 650; }
.resident-reading { flex-wrap: wrap; margin-top: 4px; color: var(--scope-muted); font-size: 11px; }
.resident-row .meter { margin-top: 6px; height: 3px; }
.kv > div { display: flex; justify-content: space-between; gap: 14px; padding: 6px 0; border-top: 1px solid var(--scope-line); font-size: 11px; }
.kv > div:first-child { border-top: 0; }
.kv dt { flex: none; color: var(--scope-muted); }
.kv dd { min-width: 0; margin: 0; text-align: right; overflow-wrap: anywhere; }
.kv { margin-top: 8px; }
.kv > .kv-block { display: grid; gap: 6px; }
.kv > .kv-block dd { text-align: left; }

/* ---------- 1.6 buttons and capture ---------- */
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 5px 12px; border: 1px solid var(--scope-line-strong); border-radius: var(--scope-radius); background: var(--scope-bg); color: var(--scope-fg); font: 12px var(--oc-font, sans-serif); white-space: nowrap; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { border-color: transparent; background: var(--scope-fill); color: var(--scope-on-fill); font-weight: 600; }
.btn.quiet { min-height: 26px; padding: 3px 6px; border-color: transparent; background: transparent; color: var(--oc-primary-text, var(--scope-accent)); }
.btn.danger { border-color: transparent; background: var(--scope-bad); color: var(--scope-bg); font-weight: 600; }
.btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
select.btn { padding-right: 8px; }
.capture-card { padding: 16px; }
footer { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--scope-line); color: var(--scope-muted); font-size: 10.5px; }

/* ---------- 2.0: one chip (1.6's catalog chip, generalised): a tone, optionally outlined ---------- */
.chip { --chip: var(--scope-muted); display: inline-block; flex: none; min-width: 0; max-width: 100%; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--chip) 12%, transparent); color: color-mix(in srgb, var(--chip) 75%, var(--scope-fg)); font-size: 10.5px; font-weight: 550; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: baseline; }
.chip[data-tone="accent"] { --chip: var(--scope-accent); }
.chip[data-tone="warn"] { --chip: var(--scope-warn); }
.chip[data-tone="bad"] { --chip: var(--scope-bad); }
.chip[data-outline] { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--chip) 55%, transparent); }
/* Attribution chips are labels, not status: fixed host colours, whatever the phase accent is. */
.chip[data-attr="inferred"], .chip[data-attr="armed"] { --chip: var(--oc-primary-text, #88b9ee); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }

/* ---------- 2.0: ⓘ disclosure. 24 px target; the explanation opens in flow below its row, never over a reading ---------- */
.title-row { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.info { position: relative; flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; margin: -5px -5px -5px -3px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--scope-muted); font: 600 10px/1 var(--oc-font, sans-serif); cursor: pointer; vertical-align: middle; }
.info::before { content: ""; position: absolute; inset: 4px; border: 1px solid var(--scope-line-strong); border-radius: 50%; }
.info:hover, .info[aria-expanded="true"] { color: var(--scope-fg); }
.info[aria-expanded="true"]::before { border-color: var(--oc-primary-text, var(--scope-accent)); }
.pop { margin-top: 8px; padding: 10px 12px; border: 1px solid var(--scope-line-strong); border-radius: var(--scope-radius); background: var(--oc-elevated, var(--scope-bg)); color: var(--scope-fg); font-size: 11px; font-weight: 400; line-height: 1.6; letter-spacing: 0; white-space: normal; text-align: left; }
.pop > strong { display: block; margin-bottom: 2px; font-weight: 600; }

<script>
'use strict';
const fx = JSON.parse(document.getElementById('fixtures').textContent);
const NOW = fx.serverNow;
const q = new URLSearchParams(location.search);
const theme = q.get('theme') === 'light' ? 'light' : 'dark';
document.documentElement.dataset.theme = theme;
const surface = q.get('surface') || 'board';
const openPop = q.get('pop'), detailsOpen = q.get('details') === 'open', shortLabels = q.get('labels') === 'short';

/* ---------- markup helpers: every fixture value is escaped ---------- */
class Raw { constructor(s) { this.s = s; } }
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

const attr = (text, on) => on ? new Raw(text) : '';
let seq = 0;
const uid = prefix => `${prefix}-${++seq}`;

/* ---------- formatting (panel/present/format.ts is the only GiB formatter in 2.0) ---------- */
const GiB = 2 ** 30, MiB = 2 ** 20, KiB = 1024;
const gib = b => `${(b / GiB).toFixed(1)} GiB`;
const kib = b => b >= MiB ? `${(b / MiB).toFixed(2)} MiB` : `${Math.round(b / KiB)} KiB`;
const int = n => Math.round(n).toLocaleString('en-US');
const kt = n => n >= 1e6 ? `${(n / 1e6).toFixed(n >= 1e7 ? 1 : 2)}M` : n >= 1e5 ? `${Math.round(n / 1e3)}K` : n >= 1e4 ? `${(n / 1e3).toFixed(1)}K` : int(n);
const tps = v => v >= 100 ? int(v) : v.toFixed(1);
const pct = f => `${Math.round(f * 100)}%`;
const delta = d => `${d > 0.004 ? '+' : d < -0.004 ? '−' : '±'}${Math.abs(Math.round(d * 100))}%`;
const dur = ms => ms < 1000 ? `${(ms / 1000).toFixed(2)} s` : ms < 10000 ? `${(ms / 1000).toFixed(1)} s` : ms < 60000 ? `${Math.round(ms / 1000)} s`
  : ms < 3600000 ? ms % 60000 === 0 ? `${ms / 60000} min` : `${Math.floor(ms / 60000)} m ${String(Math.floor(ms % 60000 / 1000)).padStart(2, '0')} s` : `${Math.floor(ms / 3600000)} h ${Math.floor(ms % 3600000 / 60000)} m`;
const ago = at => { const d = NOW - at; return d < 5000 ? 'just now' : d < 60000 ? `${Math.round(d / 1000)} s ago` : d < 3600000 ? `${Math.round(d / 60000)} min ago` : `${Math.round(d / 3600000)} h ago`; };
const until = at => dur(Math.max(0, at - NOW));
const clock = at => { const d = new Date(at), today = new Date(NOW).toISOString().slice(0, 10) === d.toISOString().slice(0, 10);
  return today ? d.toISOString().slice(11, 16) : `${d.toLocaleString('en-US', { month: 'short', timeZone: 'UTC' })} ${d.getUTCDate()}`; };
const mmss = ms => `${Math.floor(ms / 60000)}:${String(Math.floor(ms % 60000 / 1000)).padStart(2, '0')}`;
const niceCeil = v => Math.ceil(v * 1.05 / 5) * 5;

/* ---------- basis. Rule: a runtime's value, or exact arithmetic on one source's counts (a sum, a difference,

   counter deltas, vs usual) is `derived`; times Scope stamps itself are `observed`. Everything but `reported` is labelled. ---------- */
const BASIS = { derived: 'derived', observed: 'observed', 'last-observed': 'last observed', estimate: 'estimate' };
const val = (text, basis, note) => !basis || basis === 'reported'
  ? html`<span class="val" data-basis="reported">${text}</span>`
  : html`<span class="val" data-basis="${basis}">${text}<small class="basis">${note ?? BASIS[basis]}</small></span>`;
const ICON = {
  measure: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.6"/></svg>',
  close: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',

  up: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>',
  pause: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg>',
  play: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5l8 5-8 5z"/></svg>',
  more: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="15.5" cy="10" r="1.3"/></svg>',
};
const icon = k => new Raw(ICON[k]);
// ⓘ is a disclosure: a 24 px button (aria-expanded + aria-controls) whose explanation opens in flow below its row.
const tip = (key, title, paras) => {
  const id = uid('pop'), open = openPop === key;
  return { btn: html`<button class="info" type="button" aria-expanded="${open}" aria-controls="${id}" aria-label="About ${title}">i</button>`,
    pop: html`<div class="pop" id="${id}" role="note" ${attr('hidden', !open)}><strong>${title}</strong>${paras.filter(Boolean).map(p => html`<p>${p}</p>`)}</div>` };
};

/* ---------- names and messages (panel/present/messages.ts in 2.0) ---------- */
const RT = { omlx: 'oMLX', lmstudio: 'LM Studio', splash: 'Splash', 'vllm-mlx': 'vllm-mlx', 'mlx-lm': 'mlx-lm', 'llama-server': 'llama-server', ollama: 'Ollama' };
const rtName = s => s.connection.host === 'bionic' ? 'Bionic' : RT[s.connection.runtime] ?? 'the runtime';
const connName = s => s.connection.host === 'bionic' ? 'Splash via Bionic' : s.connection.label;
const PHASE = { decode: 'Generating', prefill: 'Reading context', idle: 'Idle', queued: 'Queued', processing: 'Processing', loading: 'Loading', 'not-loaded': 'No model loaded', unknown: 'Connected' };
const STATE_WORD = { recovering: 'Recovering', failing: 'Offline', detecting: 'Detecting', unconfigured: 'Not set up' };
const REASON_WORD = { status_stale: 'Status stale', not_admitting: 'Not admitting', runtime_changed: 'Runtime changed', sleeping: 'Asleep', loading: 'Loading' };
const phaseLabel = (s, v) => v.paused ? 'Paused' : STATE_WORD[s.status.state] ?? REASON_WORD[s.status.reason] ?? PHASE[s.runtime.phase];
const PRESSURE = { 1: ['Normal', 'normal'], 2: ['Warning', 'warning'], 4: ['Critical', 'critical'] };
// notifyutil thermal pressure: a user-facing word, with macOS's own level name kept for the ⓘ. One threshold everywhere.
const THERMAL = [['Normal', 'nominal'], ['Moderate', 'moderate'], ['Heavy', 'heavy'], ['Severe', 'trapping'], ['Critical', 'sleeping']];
const THERMAL_WARN = 2;
const thermalLevel = l => l >= 3 ? 'critical' : l >= THERMAL_WARN ? 'warning' : 'normal';
const WITHHOLD = {
  'several-chats': p => `${p.count ?? 2} chats running`, 'subagent-running': () => 'a subagent is running',
  'other-provider': p => `this chat uses ${p.provider}`, 'model-differs': () => 'chat model differs', 'model-unknown': () => 'chat model unknown',
  'cannot-count': () => 'runtime can’t count requests', overlap: () => 'overlapping requests', 'outside-turn': () => 'outside this chat’s turn',
  'joined-mid-turn': () => 'joined mid-turn', 'not-observed': () => 'not observed', 'projects-loading': () => 'projects loading',
  'projects-error': () => 'project list unavailable', 'too-many-projects': () => 'too many projects', 'auto-off': () => 'auto-labelling off',
  'all-requests': () => 'all requests',
};
const WHY = {
  inferred: (rt, live) => ['This chat · inferred', live
    ? `So far only this chat has been running on ${rt}, its model matches, and Scope has seen every reading since the reply started.`
    : `Only this chat was running on ${rt}, its model matched, and Scope saw the whole reply.`,
    `Inferred from OpenChamber’s chat activity: ${rt} doesn’t report which chat a request came from. OpenChamber’s own background model calls, such as title generation, can fall inside an inferred turn.`],
  armed: (rt, live) => ['Next reply · armed', live
    ? `You armed Next reply, and so far at every step only this chat has been running on ${rt} with a matching model.`
    : `You armed Next reply, and at every step only this chat was running on ${rt} with a matching model.`,
    `Still inferred from chat activity, not reported by ${rt}.`],
  'several-chats': rt => ['Server-wide', `Another chat was running on ${rt} at the same time, so this reading can’t be tied to this chat.`, 'Readings stay server-wide until one chat is running.'],
  'subagent-running': rt => ['Server-wide', `A subagent of this chat was running on ${rt}, so replies can’t be told apart.`, 'Readings stay server-wide until the subagent finishes.'],
  'other-provider': (rt, live, p) => ['Server-wide', `This chat runs on ${p.provider}, so what ${rt} is doing belongs to another app or chat.`, `Watch ${p.provider} to label this chat’s readings.`],
  'model-differs': rt => ['Server-wide', `This chat’s model isn’t the model ${rt} is running, so the reading belongs to another app or chat.`, 'Scope never loads or switches models.'],
  'not-observed': rt => ['Server-wide', `No Scope view saw this chat’s turn while the reply ran on ${rt}, so it can’t be tied to a chat.`, 'Labels need a Scope view open for the whole reply.'],
  overlap: rt => ['Server-wide', `More than one request was running on ${rt}, so no reading belongs to a single chat.`, 'Per-request speed comes back when one request runs.'],
  'cannot-count': rt => ['Server-wide', `${rt} doesn’t report how many requests are running, so no reading can be tied to a chat.`, ''],
  'all-requests': rt => ['Server-wide', `Everything ${rt} is doing, from any app or chat.`, 'Per-chat labels need per-request readings and one running chat.'],
};
const whyOf = (a, s, live) => { const key = a.label === 'inferred' || a.label === 'armed' ? a.label : a.reason; return (WHY[key] ?? WHY['all-requests'])(rtName(s), live, a.params ?? {}); };
const ALERT = {
  'runtime-lost': p => [`${RT[p.runtime] ?? 'The runtime'} stopped responding`, 'Scope checks again automatically'],
  'model-unloaded': p => [`${p.model} was unloaded`, 'Reported by the runtime · Scope never loads models'],
  'pressure-warning': () => ['macOS memory pressure: warning', 'Reported by the macOS kernel · apps may be compressed or swapped'],
  'pressure-critical': () => ['macOS memory pressure: critical', 'Reported by the macOS kernel · replies may slow sharply until memory frees up'],
  'swap-growth': p => [`Swap grew ${gib(p.deltaBytes)} in ${Math.round(p.windowMs / 60000)} min`, 'Within one continuous stretch of readings'],
  thermal: p => [`Thermal pressure: ${THERMAL[p.level][0].toLowerCase()}`, 'Reported by macOS · the chip may run slower'],
  'splash-recovering': () => ['Splash was recovering', 'Reported by Splash'],
  'omlx-prefill-stall': p => ['Prefill progress stopped moving', `No change for ${dur(p.stalledMs ?? 30000)} · reported by oMLX`],
  'omlx-memory-guard': () => ['oMLX memory guard is active', 'Reported by oMLX · new requests wait until memory frees up · not macOS memory pressure'],
};
// Status reasons (src/contract/reasons.ts) → one message. The callout carries it; nothing else in the view repeats it.
const STATUS = {
  runtime_unreachable: (s, rt, p) => ({ sev: 'critical', title: `${rt} stopped responding`, since: p.sinceAt, detail: `Nothing answers on :${p.port}. Scope checks again automatically, so start ${rt} and it picks up again.`, action: 'Connection…' }),
  authentication_failed: (s, rt) => ({ sev: 'critical', title: `${rt} refused Scope’s key`, detail: 'Check the key under Connection. Scope reads it from the runtime’s own config and never stores it.', action: 'Connection…' }),
  configuration_missing: () => ({ sev: 'warning', title: 'No runtime found', detail: 'Nothing answered on the usual local ports. Start a runtime, or choose one.', action: 'Choose connection' }),
  unsupported_runtime: (s, rt, p) => ({ sev: 'warning', title: 'Scope doesn’t recognise this runtime', detail: `Something answers on :${p.port}, but not like any runtime Scope supports.`, action: 'Choose connection' }),
  unsupported_contract: (s, rt) => ({ sev: 'warning', title: `${rt} answered in a shape Scope doesn’t know`, detail: 'Scope shows what it can still read, and checks which runtime this is after 3 tries.' }),
  detecting: (s, rt, p) => ({ sev: 'info', title: 'Looking for a runtime', detail: `Checking :${p.port} for oMLX, llama-server, Ollama, LM Studio, Splash and vllm-mlx.` }),
  redetecting: (s, rt, p) => ({ sev: 'info', title: 'Checking which runtime this is', detail: `${rt} stopped answering like itself on :${p.port}.` }),
  runtime_changed: (s, rt, p) => ({ sev: 'warning', title: `Looks like ${RT[p.detected]} now`, detail: `${connName(s)} is chosen, but ${RT[p.detected]} answers on :${p.port}. Scope never switches on its own.`, action: `Switch to ${RT[p.detected]}` }),
  loading: () => ({ sev: 'info', title: 'llama-server is loading a model', detail: 'Its health check answers 503 until the model is ready.' }),
  recovering: (s, rt, p) => ({ sev: 'warning', title: 'Splash is recovering', since: s.status.sinceAt, detail: `It’s restarting its engine after a fault. Scope reads its status every 30 s, so it doesn’t add to the restart.${p.crashTrace ? ' Splash recorded a crash trace; Scope doesn’t show or send it.' : ''}` }),
  status_stale: (s, rt, p) => ({ sev: 'warning', title: 'Splash’s status is stale', since: p.staleSinceAt, detail: 'Splash says its status hasn’t refreshed, so Scope marks its readings last observed until it does.' }),

  admin_unauthorized: () => ({ sev: 'info', title: 'oMLX admin login refused', detail: 'Scope reads oMLX’s public status instead: server-wide totals only, with no per-request speed, reply history or usage records.', action: 'Connection…' }),

  metrics_required: () => ({ sev: 'info', title: 'Live slots need --metrics', detail: 'This llama-server build can sleep, and reading its slots without /metrics would wake it. Start llama-server with --metrics to see slots and throughput.' }),
  sleeping: () => ({ sev: 'info', title: 'llama-server is asleep', detail: 'It unloads the model while idle and wakes on the next request. Scope doesn’t read slots or metrics while it sleeps, so it stays asleep.' }),

const SEV = { critical: 3, warning: 2, info: 1 };
const SEV_WORD = { critical: 'Critical', warning: 'Warning', info: 'Notice' };

/* ---------- scenarios: a v2 snapshot plus panel-side state ---------- */
const merge = (a, b) => b === undefined ? a : b === null || typeof b !== 'object' || Array.isArray(b) ? b

const scenario = id => {
  const st = fx.states[id] ?? fx.states.decode;
  const s = merge(fx.snapshots[st.snapshot], st.patch);
  const v = { ...fx.panel.defaults, ...st.view };
  const last = s.completions.items.at(-1) ?? null;
  const lastAttr = 'lastAttr' in (st.view ?? {}) ? v.lastAttr : last?.verdict ? { label: last.verdict.attr, reason: last.verdict.reason } : { label: 'server', reason: 'not-observed' };
  return { id, st, s, v, last, lastAttr };
};
const modelOf = s => s.runtime.request?.model ?? s.runtime.residency[0]?.model ?? s.runtime.catalog.find(m => m.loaded)?.name ?? null;
const shortModel = m => m.split('/').at(-1);
const glanceModel = m => shortModel(m).replace(/[-_.](?:\d+bit|mlx|q\d\w*|gguf|splash)$/i, '');
const statusMsg = s => STATUS[s.status.reason]?.(s, rtName(s), s.status.params ?? {}) ?? null;
const alertMsgs = s => s.alerts
  .filter(a => !(a.id === 'runtime-lost' && s.status.state === 'failing') && !(a.id === 'splash-recovering' && s.status.state === 'recovering'))
  .map(a => { const [title, detail] = ALERT[a.id](a.params); return { id: a.id, sev: a.severity, title, detail, since: a.since }; })
  .sort((a, b) => SEV[b.sev] - SEV[a.sev] || b.since - a.since);

/* ---------- small parts ---------- */
// A server-wide label always carries its reason: inside the chip, or (glance only) in a line the chip points to.
const attrChip = (a, describedBy) => {

      <div><span class="machine-label">RAM</span><strong>${(h.memUsedBytes / GiB).toFixed(1)} / ${Math.round(h.memTotalBytes / GiB)} GiB</strong><div class="meter" aria-hidden="true"><i style="width:${pct(h.memUsedBytes / h.memTotalBytes)}"></i></div></div>
      <div><span class="machine-label">Swap</span><strong>${gib(m.swapUsedBytes)}</strong></div></div>
    <div class="mac-rows">

      ${model != null && m.wiredLimitBytes ? html`<div class="mac-row"><span>${rt} ${kind} vs macOS GPU wired limit</span>${val(`${pct(model / m.wiredLimitBytes)} of ${gib(m.wiredLimitBytes)}`, stale ? 'last-observed' : 'reported')}<div class="meter" aria-hidden="true"><i style="width:${pct(model / m.wiredLimitBytes)}"></i></div></div>` : ''}
      ${h.runtimeProcess ? html`<div class="mac-row"><span>${RT[h.runtimeProcess.runtime]} process listening on :${h.runtimeProcess.port}</span>${val(gib(h.runtimeProcess.footprintBytes), 'observed', 'macOS footprint')}</div>` : ''}
      ${h.power ? html`<div class="mac-row"><span>${LABEL.power}</span>${val(`${h.power.chipW.toFixed(1)} W`, 'estimate')}</div>` : ''}
      ${perJ != null ? html`<div class="mac-row"><span>tok/J · this request</span>${val(`${perJ.toFixed(2)} · ${delta((perJ - bJ.p50) / bJ.p50)} vs usual`, 'estimate')}</div>` : ''}
    </div></details></section>`;
};
const liveBody = (sc, ceiling) => html`${callouts(sc.s)}${hero(sc, ceiling)}${tiles(sc)}${macCard(sc)}`;

/* ---------- Server ---------- */
const REPORTS = [['request.decodeRate', 'per-request speed'], ['request.prefillProgress', 'prefill progress'], ['server.requests', 'request counts'], ['server.cache', 'cache'],
  ['server.memory.model', 'model memory'], ['server.memory.metal', 'Metal memory'], ['server.averages', 'server averages'], ['server.latency', 'latency percentiles'], ['server.slots', 'slots'],
  ['server.rates', 'throughput'], ['server.speculative', 'speculative decoding'], ['server.residency', 'loaded models'], ['server.engines', 'engines'], ['server.usage', 'usage history'], ['server.completions', 'replies']];
const runtimeCard = s => {
  const c = s.connection, reports = REPORTS.filter(([k]) => s.capabilities[k]).map(([, t]) => t), comp = s.capabilities['server.completions'];
  const status = { ready: s.status.reason === 'sleeping' ? 'Asleep' : 'Ready', degraded: 'Limited', recovering: 'Recovering', failing: 'Not responding', detecting: 'Detecting', unconfigured: 'Not set up' }[s.status.state];
  return section('Runtime', status, html`<dl class="kv">
    <div><dt>Runtime</dt><dd>${connName(s)}</dd></div>
    ${c.runtime ? html`<div><dt>Version</dt><dd>${c.version ?? (c.runtime === 'splash' ? 'Not reported · 1.1 features detected' : 'Not reported')}</dd></div>` : ''}
    ${c.engine ? html`<div><dt>Engine</dt><dd>${c.engine === 'splash' ? 'Splash runtime pack' : c.engine}</dd></div>` : ''}
    ${c.detection.probe ? html`<div><dt>Detected</dt><dd>${c.detection.probe} answered · ${c.detection.confidence} confidence</dd></div>` : ''}
    <div class="kv-block"><dt>Reports</dt><dd class="chips">${reports.length ? reports.map(r => html`<span class="chip">${r}</span>`) : 'Nothing yet'}</dd></div>
    ${c.runtime ? html`<div><dt>Replies recorded as</dt><dd>${comp ? { reported: 'Reported by the runtime', 'last-observed': 'Last observed by Scope', derived: 'Derived from counters', observed: 'Observed by Scope' }[comp.basis] : `None · ${rtName(s)} doesn’t report them`}</dd></div>` : ''}</dl>`);
};
const memoryCard = s => {
  const m = s.runtime.memory, stale = s.status.state === 'recovering' || s.status.reason === 'status_stale';
  if (m.metalBytes != null) return section('Runtime memory', `Splash · ${stale ? 'last observed' : 'reported'}`, html`<div class="values-2"><div><span>Metal memory</span><strong>${gib(m.metalBytes)}</strong></div><div><span>Metal peak</span><strong>${gib(m.metalPeakBytes)}</strong></div></div>`,
    tip('mem', 'Runtime memory', ['Splash’s own Metal allocation, kept separate from process memory.', 'Live → This Mac compares it with the macOS GPU wired limit.']));
  if (m.modelBytes == null) return '';
  return section('Runtime memory', `${rtName(s)} · reported`, html`<div class="values-2"><div><span>Model memory</span><strong>${gib(m.modelBytes)}</strong></div><div><span>Engine-pool ceiling</span><strong>${gib(m.ceilingBytes)}</strong></div></div>
    <div class="meter" style="margin-top:10px" aria-hidden="true"><i style="width:${pct(m.modelBytes / m.ceilingBytes)}"></i></div>`,
    tip('mem', 'Runtime memory', ['oMLX’s model allocation against its engine-pool ceiling, as oMLX reports them. Not per-chat memory.', 'The oMLX process footprint and the macOS GPU wired limit are on Live → This Mac.']));
};
const cacheCard = s => {
  const req = s.runtime.request, c = s.runtime.server.cache;
  if (!c) return '';
  return section('Cache & input', req ? 'Current request' : 'Server cache', html`${req ? html`<div class="values-2 big-values"><div><span>Reused tokens</span><strong data-basis="reported">${int(req.cachedTokens)}</strong></div><div><span>Not reused</span><strong data-basis="reported">${int(req.promptTokens - req.cachedTokens)}</strong></div></div>
    <div class="cache-input-bar" aria-hidden="true"><span style="width:${pct(req.cachedTokens / req.promptTokens)}"></span></div>` : ''}
    <div class="values-2"><div><span>RAM cache</span><strong>${gib(c.ramBytes)}</strong><small>${c.ramEntries} entries</small></div><div><span>SSD cache</span><strong>${gib(c.ssdBytes)}</strong><small>${c.ssdEntries} entries</small></div></div>`,
    tip('cache', 'Cache & input', ['Reused and not-reused tokens are oMLX’s counts for the current request.', 'Unreused input is not necessarily the size of a prefill stage.']));
};
const residencyCard = s => {
  const list = s.runtime.residency;
  if (!list.length) return '';
  const src = list[0].source, many = list.length > 1;
  const rows = list.map(m => {
    if (m.source === 'ollama-ps') return html`<li class="resident-row" data-loaded="true"><div class="resident-heading"><strong translate="no">${m.model}</strong><span class="chip">unloads in ${until(m.unloadsAt)}</span></div>
      <div class="resident-reading"><span>${gib(m.bytes)} loaded</span><span>GPU-resident (Ollama-reported) ${gib(m.gpuResidentBytes)} · ${pct(m.gpuResidentBytes / m.bytes)}</span></div>
      <div class="meter" aria-hidden="true"><i style="width:${pct(m.gpuResidentBytes / m.bytes)}"></i></div></li>`;
    return html`<li class="resident-row" data-loaded="true"><div class="resident-heading"><strong translate="no">${m.model}</strong><span class="chip" ${attr('data-tone="accent"', m.phase !== 'idle')}>${PHASE[m.phase]}</span></div>
      ${src === 'lms-ps' || many ? html`<div class="resident-reading"><span>${gib(m.bytes)} ${src === 'lms-ps' ? 'loaded' : 'allocated'}</span></div>` : ''}</li>`;
  });
  const title = src === 'lms-ps' ? 'Loaded instances' : 'Loaded models';
  const right = src === 'lms-ps' ? 'lms ps · refreshed on load/unload' : `${list.length} loaded`;
  const note = src === 'ollama-ps' ? ['Ollama reports residency only: how much of each model it holds on the GPU.', 'Apple silicon shares one memory pool, so GPU-resident is not a separate memory.']
    : src === 'lms-ps' ? ['From LM Studio’s CLI with the no-wake server path, so it never starts Bionic.', 'Context sizes and formats are in the model inventory below.']
    : ['Models the runtime reports as loaded. Not assigned to a chat.', many ? null : 'With one model loaded, its memory is the Runtime memory figure.'];
  return section(title, right, html`<ul class="resident-list">${rows}</ul>`, tip('resident', title, note));
};
const sessionCard = s => {
  const a = s.runtime.server.averages;
  if (!a) return '';
  const stale = s.status.state === 'recovering' || s.status.reason === 'status_stale';
  const b = stale ? 'last-observed' : 'reported', since = stale ? `before ${clock(s.status.sinceAt)}` : a.uptimeMs ? `${dur(a.uptimeMs)} · since start` : 'Since the log stream started';
  return section('Server session', since, html`<div class="values-2">${a.decodeTps != null ? html`<div><span>Decode average</span><strong>${val(`${tps(a.decodeTps)} tok/s`, b)}</strong></div>` : ''}${a.prefillTps != null ? html`<div><span>Prefill average</span><strong>${val(`${tps(a.prefillTps)} tok/s`, b)}</strong></div>` : ''}${a.cacheEfficiencyFraction != null ? html`<div><span>Cache efficiency</span><strong>${val(pct(a.cacheEfficiencyFraction), b)}</strong></div>` : ''}
    <div><span>Completed</span><strong>${val(int(a.requestsTotal), b)}</strong>${a.failedTotal ? html`<small>${a.failedTotal} failed</small>` : ''}</div></div>`,
    tip('session', 'Server session', ['Across all models and apps that used this runtime, as the runtime reports them.']));
};
const latencyCard = s => {
  const hg = s.runtime.server.histograms;
  if (!hg) return '';
  const q = (label, x) => html`<div><span>${label} p50 · p95</span><strong>${dur(x.p50)} · ${dur(x.p95)}</strong><small>n ${int(x.n)}</small></div>`;
  return section('Latency', s.status.state === 'recovering' || s.status.reason === 'status_stale' ? 'Splash native · last observed' : 'Splash native', html`<div class="values-2">${q('TTFT', hg.ttftMs)}${q('Between tokens', hg.itlMs)}</div>`,
    tip('latency', 'Latency', ['Splash’s own percentiles over its last 4,096 samples, across all clients.', 'Splash reports p95; Scope’s own baselines use p90.']));
};
const slotsCard = s => {
  const slots = s.runtime.slots;
  if (!slots.length) return '';
  const busy = slots.filter(x => x.busy).length;
  return section('Slots', `${busy} of ${slots.length} busy`, html`<ul class="resident-list">${slots.map(x => html`<li class="resident-row"><div class="resident-heading"><strong>Slot ${x.id}</strong><span class="chip" ${attr('data-tone="accent"', x.busy)}>${x.busy ? 'Busy' : 'Idle'}</span></div>
      <div class="resident-reading"><span>${x.busy ? `${int(x.decodedTokens)} decoded · ${kt(x.promptTokens)} prompt` : 'Waiting'}</span><span>${kt(x.contextWindowTokens)} context</span></div></li>`)}</ul>`,
    tip('slots', 'Slots', ['Numbers only: Scope never reads prompts from /slots.', 'It polls /slots only while /metrics shows work, so a sleeping server stays asleep.']));
};
const ratesCard = s => {
  const r = s.runtime.server.rates;
  if (!r) return '';
  return section('Server throughput', `last ${Math.round(r.windowMs / 1000)} s`, html`<div class="values-3"><div><span>Prompt</span><strong>${val(`${int(r.promptTps)} tok/s`, 'derived')}</strong></div><div><span>Decode</span><strong>${val(`${tps(r.decodeTps)} tok/s`, 'derived')}</strong></div><div><span>Processing · deferred</span><strong>${s.runtime.server.active} · ${s.runtime.server.queued}</strong></div></div>`,
    tip('rates', 'Server throughput', ['Worked out from llama-server’s running totals, never its windowed gauges (every scrape resets those).']));
};
const specCard = s => {
  const sp = s.runtime.server.speculative;
  if (!sp) return '';
  return section('Speculative decoding', `last ${Math.round(sp.windowMs / 60000)} min`, html`<div class="values-2"><div><span>Draft acceptance</span><strong>${val(pct(sp.acceptanceFraction), 'derived')}</strong></div><div><span>Accepted</span><strong>${int(sp.acceptedTokens)} of ${int(sp.draftedTokens)}</strong></div></div>
    <div class="meter" style="margin-top:10px" aria-hidden="true"><i style="width:${pct(sp.acceptanceFraction)}"></i></div>`,
    tip('spec', 'Speculative decoding', ['Server-wide, from llama-server’s counters.', 'Higher acceptance means the draft model guesses more tokens that the main model keeps.']));
};
const enginesCard = s => {
  const e = s.runtime.engines;
  if (!e.length) return '';
  return section('Engines', 'lms runtime ls · cached 10 min', html`<ul class="resident-list">${e.map(x => html`<li class="resident-row"><div class="resident-heading"><strong>${x.name} ${x.version}</strong><span class="chip" ${attr('data-tone="accent"', x.selected)}>${x.selected ? 'In use' : 'Installed'}</span></div></li>`)}</ul>`,
    tip('engines', 'Engines', ['Read only while this tab is visible. Scope never installs, selects or updates engines.']));
};
const catalogCard = s => {
  const c = s.runtime.catalog;
  if (!c.length) return '';
  return section('Model inventory', `${c.filter(m => m.loaded).length} loaded · ${c.length} listed`, html`<ul class="resident-list">${c.map(m => html`<li class="resident-row" data-loaded="${!!m.loaded}"><div class="resident-heading"><strong translate="no">${m.name}</strong><span class="chips">${m.format ? html`<span class="chip" ${attr('data-tone="accent"', m.format === 'splash')}>${m.format}</span>` : ''}${m.vision ? html`<span class="chip">vision · ${m.inputModalities.join(' + ')}</span>` : ''}</span></div>
      <div class="resident-reading"><span>${m.loaded ? 'Loaded' : 'Available'}</span><span>${kt(m.contextWindowTokens)} context</span></div></li>`)}</ul>`);
};
const serverBody = sc => { const s = sc.s; return html`${callouts(s)}${runtimeCard(s)}${slotsCard(s)}${ratesCard(s)}${specCard(s)}${latencyCard(s)}${memoryCard(s)}${cacheCard(s)}${residencyCard(s)}${enginesCard(s)}${catalogCard(s)}${sessionCard(s)}`; };

/* ---------- History ---------- */
const ledgerRow = r => {
  if (r.kind === 'gap') return html`<li class="led-row" data-kind="gap"><div class="gap-row"><span>Not observed · Scope wasn’t open · ${clock(r.fromAt)}–${clock(r.toAt)}</span></div></li>`;
  if (r.kind === 't') return html`<li class="led-row" data-kind="t"><time>${clock(r.endedAt)}</time><div class="led-main"><strong>Turn · ${r.steps} steps</strong>${val(dur(r.endedAt - r.startedAt - r.waitMs), 'observed', 'observed · waits excluded')}
    ${val(`${tps(r.wDecodeTps)} tok/s token-weighted`, 'derived')}<span>${int(r.outputTokens)} out · ${pct(r.cacheReuseFraction)} of input reused</span>${attrChip(r.attr)}</div></li>`;
  return html`<li class="led-row"><time>${clock(r.finishedAt)}</time><div class="led-main">${val(html`<strong>${tps(r.decodeTps)} tok/s</strong>`, r.basis)}<span>${int(r.outputTokens)} out · ${kt(r.promptTokens)} in${r.cachedTokens ? ` (${kt(r.cachedTokens)} cached)` : ''}</span>${attrChip(r.attr)}</div></li>`;
};
const repliesCard = empty => {
  const c = fx.panel.basisCounts, t = tip('replies', 'Replies', ['Each reply Scope saw finish while any Scope view was open, with its label.', 'A turn summary appears only when every step in it is attributed. Rows with no verdict read “Server-wide · not observed”.', 'oMLX doesn’t report completions, so its rows are Scope’s last reading of the request.']);
  if (empty) return section('Replies', 'Observed while Scope was open', html`<p class="empty">No replies yet. Scope records a reply when it finishes while any Scope view is open. Your 1.6 captures are in Captures.</p>`, t);
  return section('Replies', 'Observed while Scope was open', html`<div class="counts">${Object.entries(c).filter(([, n]) => n).map(([b, n]) => html`<span class="chip">${n} ${BASIS[b] ?? b}</span>`)}<span class="chip">1 gap</span></div>
    <ol class="ledger">${fx.panel.ledger.map(ledgerRow)}</ol>`, t);
};
const baselineCard = empty => {
  const b = fx.panel.baseline, t = tip('baseline', 'Usual speed', ['Last 14 days, up to 50 replies, excluding the current 30 min. p50 needs 5 replies and p90 needs 10.', 'Overlapping, aggregate and gap rows are left out, and so are oMLX rows for TTFT and token statistics.']);
  if (empty) return section('Usual speed', html`<span translate="no">Example-27B-4bit</span>`, html`<p class="empty">Needs 5 replies for this model and context size.</p>`, t);
  return section('Usual speed', html`<span translate="no">Example-27B-4bit</span> · ${b.ctxBucket}`, html`<div class="values-3">
      <div><span>Decode p50</span><strong>${tps(b.decode.p50)} tok/s</strong><small>n ${b.decode.n}</small></div>
      <div><span>Decode p90</span><strong>${tps(b.decode.p90)} tok/s</strong><small>n ${b.decode.n}</small></div>
      <div><span>Prefill p50</span><strong>${tps(b.prefill.p50)} tok/s</strong><small>n ${b.prefill.n}</small></div></div>
    <dl class="kv"><div><dt>tok/J, usual</dt><dd>${val(`${b.tokPerW.p50.toFixed(2)} · n ${b.tokPerW.n}`, 'estimate', 'estimate baseline')}</dd></div><div><dt>TTFT</dt><dd>No baseline · oMLX doesn’t report it</dd></div></dl>
    <div class="actions"><button class="btn" type="button">Copy baseline summary</button><span class="insight-note" style="margin:0">Models become “Model A, B”</span></div>`, t);
};
const usageCard = () => {
  const u = fx.usage, max = Math.max(...u.buckets.map(b => b.outputTokens)), day = at => `${new Date(at).toLocaleString('en-US', { month: 'short', timeZone: 'UTC' })} ${new Date(at).getUTCDate()}`;
  return section('Recorded by oMLX', html`<span class="seg">${['7d', '30d', '90d'].map(r => html`<button type="button" aria-pressed="${r === u.range}">${r}</button>`)}</span>`, html`
    <div class="usage-bars" role="img" aria-label="Output tokens per day: ${u.buckets.map(b => `${day(b.at)} ${kt(b.outputTokens)}`).join(', ')}">${u.buckets.map(b => html`<div aria-hidden="true"><i style="height:${Math.max(2, b.outputTokens / max * 72).toFixed(0)}px"></i></div>`)}</div>
    <div class="usage-days" aria-hidden="true">${u.buckets.map(b => html`<span>${new Date(b.at).toISOString().slice(8, 10)}</span>`)}</div>
    <div class="values-3"><div><span>Requests</span><strong>${int(u.totals.requests)}</strong></div><div><span>Prompt</span><strong>${kt(u.totals.promptTokens)}</strong><small>${kt(u.totals.cachedTokens)} cached</small></div><div><span>Output</span><strong>${kt(u.totals.outputTokens)}</strong></div></div>`,
    tip('usage', 'Recorded by oMLX', [`oMLX’s own records for every app that used it: output tokens per day. Refreshed ${ago(u.cachedAt)}.`, 'Never merged into Scope’s history, and it has no TTFT.']));
};
const storageCard = mode => {
  const st = mode === 'full' ? fx.panel.storageFull : mode === 'empty' ? { ...fx.panel.storage, usedBytes: 2048, replies: 0, days: 0 } : fx.panel.storage;
  const t = tip('storage', 'Reply history', ['In OpenChamber’s extension storage on this Mac, which backups include.', 'Saved by whichever Scope view is recording (page, panel or Work Status) at most every 5 min, or when it hides. Nothing is written while idle. Model names never leave this Mac.']);
  return html`<section class="insight-section storage" data-full="${mode === 'full'}"><div class="section-heading"><div class="title-row"><h2>Reply history</h2>${t.btn}</div><span>${mode === 'paused' ? html`<span class="chip" data-tone="warn">Recording paused</span>` : 'Stored on this Mac'}</span></div>${t.pop}
    ${mode === 'full' ? html`<div class="connection-diagnosis" data-severity="warning" role="status"><p class="diag-title"><span class="sr-only">Warning: </span><strong>History is full</strong></p><p class="diag-meta">After each save Scope removes the oldest replies, so it holds ${st.days} of your ${st.retentionDays} days. Shorten retention or clear to make room.</p></div>` : ''}
    ${mode === 'confirm' ? html`<div class="connection-diagnosis" data-severity="critical" role="alertdialog" aria-labelledby="clear-title"><p class="diag-title"><strong id="clear-title">Clear ${int(st.replies)} replies and the baselines built from them?</strong></p><p class="diag-meta">This can’t be undone. Captures are kept.</p><div class="actions"><button class="btn danger" type="button">Clear history</button><button class="btn" type="button">Cancel</button></div></div>` : ''}
    ${mode === 'confirm' ? '' : html`<div class="storage-line"><strong>${kib(st.usedBytes)}</strong><span>${mode === 'full' ? 'at the limit' : `of ${kib(st.capBytes)}`} · ${int(st.replies)} replies · ${st.days} days</span></div>
    <div class="meter" aria-hidden="true"><i style="width:${pct(st.usedBytes / st.capBytes)}"></i></div>
    <div class="storage-controls"><label>Keep <select class="btn"><option>${st.retentionDays} days</option></select></label><button class="btn" type="button">${mode === 'paused' ? 'Resume recording' : 'Pause recording'}</button><button class="btn" type="button">Clear…</button></div>`}</section>`;
};
const alertLogCard = (s, empty) => {
  const log = s.alertLog.length ? s.alertLog : fx.snapshots['omlx-decode'].alertLog, t = tip('alog', 'Alert log', ['Kept in the service’s memory only, so it clears when the service restarts.']);

    : html`<ol class="alog">${log.map(a => html`<li><time>${clock(a.since)}</time><span><i class="sev" data-severity="${a.severity}" aria-hidden="true"></i><span class="sr-only">${SEV_WORD[a.severity]}: </span>${ALERT[a.id](a.params)[0]}</span><small>${a.until ? dur(a.until - a.since) : 'active'}</small></li>`)}</ol>`, t);
};
const historyBody = (sc, page, ceiling) => {
  const empty = sc.v.history === 'empty', trend = empty ? fx.trendFresh : fx.trend;
  const t = tip('trend', 'Trend', ['Decode speed as oMLX reports it, in 20 s buckets: the line is each bucket’s last reading and the band its min–max.', 'The line breaks while nothing is generating. Hatched spans weren’t observed because no Scope view was open. Nothing is interpolated.']);
  return html`${page ? html`<div class="col-title"><h2>History</h2><span>Observed while Scope was open · stored on this Mac</span></div>` : ''}
  ${section('Trend', html`<span class="seg">${['15 min', '30 min', '60 min'].map(w => html`<button type="button" aria-pressed="${w === '60 min'}">${w}</button>`)}</span>`, trendChart(trend, !page, ceiling), t)}
  ${repliesCard(empty)}${baselineCard(empty)}${sc.s.capabilities['server.usage'] ? usageCard() : ''}${storageCard(empty ? 'empty' : sc.v.storage)}${alertLogCard(sc.s, empty)}`;
};

/* ---------- Captures ---------- */
const capturesBody = sc => {
  const saved = fx.panel.captures, armed = sc.v.next?.state === 'armed';
  const t = tip('capture-next', 'Next reply', ['Arms for 2 min and measures one reply on this chat’s model, then stops.', 'Cancels if you switch chats, the runtime goes away, or this view closes. It won’t arm when the chat uses another runtime or model; it offers to watch that runtime instead.']);
  return html`<section class="capture-card"><div class="section-heading"><div class="title-row"><h2>Next reply</h2>${t.btn}</div>${armed ? html`<span class="title-row">${attrChip({ label: 'armed' })}</span>` : ''}</div>${t.pop}
    <p class="insight-note">Measures your next reply in this chat, then stops.</p>

  <section class="capture-card"><div class="section-heading"><h2>Window</h2><span>Server-wide</span></div>

    <p class="notice" style="margin-top:12px">Monitoring keeps running while you capture.</p></section>
  ${section('Saved', `${saved.length} of 12 · oldest replaced when full`, html`<ol class="ledger">${saved.map(c => html`<li class="led-row"><time>${clock(c.at)}</time><div class="led-main">${val(html`<strong>${tps(c.decodeTps)} tok/s</strong>`, 'reported')}<span translate="no">${c.kind === 'next-reply' ? 'Next reply' : `Window ${c.windowMs / 1000} s`} · ${c.model}</span>${attrChip(c.attr)}<button class="btn quiet" type="button">Compare</button></div></li>`)}</ol>
    <div class="actions"><button class="btn" type="button">Copy</button><button class="btn" type="button">Add to chat draft</button><span class="insight-note" style="margin:0">Never includes model names</span></div>`)}`;
};

/* ---------- Needs approval, needs a restart ---------- */

const restartView = () => html`<div class="view"><section class="approval-card" aria-labelledby="restart-title">

/* ---------- surfaces ---------- */
const scopeAttrs = (s, v, surf) => new Raw(`data-surface="${surf}" data-phase="${s.status.state === 'recovering' || s.status.reason === 'status_stale' ? 'reconnecting' : s.status.state === 'failing' ? 'offline' : ['detecting', 'unconfigured'].includes(s.status.state) ? 'detecting' : s.runtime.phase}" data-stale="${s.status.state === 'failing'}" data-approval="${!!(v.approval || v.frame)}" data-paused="${!!v.paused}"`);
// Side by side on the page, the live chart and the trend share one y-scale.
const sharedCeiling = sc => niceCeil(Math.max(liveMax(sc.s.runtime.request), trendMax(sc.v.history === 'empty' ? fx.trendFresh : fx.trend), 20));
const rail = () => {
  const tab = q.get('tab') || 'live', sc = scenario(q.get('state') || 'decode'), { s, v } = sc, ceiling = sharedCeiling(sc);
  if (q.get('compact')) return compactRail(sc);
  if (v.approval || v.frame) return html`<main class="scope" ${scopeAttrs(s, v, 'panel')}>${masthead(s, v)}${v.approval ? approvalView() : restartView()}${footer(s)}</main>`;
  const body = tab === 'server' ? serverBody(sc) : tab === 'history' ? historyBody(sc, false, ceiling) : tab === 'captures' ? capturesBody(sc) : liveBody(sc, ceiling);
  return html`<main class="scope" ${scopeAttrs(s, v, 'panel')}>${masthead(s, v)}${tabs(tab)}${panel(tab, body)}${hiddenPanels(tab)}${footer(s)}</main>`;
};
const page = () => {
  const sc = scenario(q.get('state') || 'decode'), { s, v } = sc, ceiling = sharedCeiling(sc);
  if (v.approval || v.frame) return html`<main class="scope" ${scopeAttrs(s, v, 'page')}>${masthead(s, v)}${v.approval ? approvalView() : restartView()}${footer(s)}</main>`;
  return html`<main class="scope" ${scopeAttrs(s, v, 'page')}>${masthead(s, v)}${tabs('live', true)}
    <div class="page-cols" role="tabpanel" id="panel-live" aria-labelledby="tab-live" tabindex="0"><div class="view page-live"><div class="col-title"><h2>Live</h2><span>90 s · this chat when inferred</span></div>${liveBody(sc, ceiling)}</div>
    <div class="view">${historyBody(sc, true, ceiling)}</div></div>${hiddenPanels('live', true)}${footer(s)}</main>`;
};

/* ---------- the glance: Work Status section and rail Compact. Line 1: phase dot · model · reading · label; line 2: sparkline, chips, the view switch; line 3: the top alert ---------- */
const dot = tone => html`<span class="ws-dot" data-tone="${tone}" aria-hidden="true"></span>`;
const toggle = expanded => html`<button class="ws-toggle" type="button" aria-expanded="${expanded}" aria-label="${expanded ? 'Show the glance view' : 'Show turn stats'}">${icon(expanded ? 'up' : 'down')}</button>`;
// Chips appear only when they say something: pressure and thermal when not normal, GPU busy while a request runs. An alert on line 3 is not repeated as a chip.
const wsChips = (s, { gpu = true, skip = [] } = {}) => {
  const [p, lvl] = PRESSURE[s.host.mac.pressureLevel] ?? [], th = s.host.thermal;
  return html`${p && lvl !== 'normal' && !skip.includes('pressure') ? html`<span class="chip" data-tone="${lvl === 'critical' ? 'bad' : 'warn'}">Pressure ${p.toLowerCase()}</span>` : ''}${th && th.level >= THERMAL_WARN && !skip.includes('thermal') ? html`<span class="chip" data-tone="${thermalLevel(th.level) === 'critical' ? 'bad' : 'warn'}">${THERMAL[th.level][0]} heat</span>` : ''}${gpu && s.host.gpu?.busyFraction != null ? html`<span class="chip">GPU ${pct(s.host.gpu.busyFraction)} busy</span>` : ''}`;
};
const chipOf = id => /^pressure/.test(id) ? 'pressure' : id === 'thermal' ? 'thermal' : null;
const alertLine = s => {
  const msgs = alertMsgs(s);
  if (!msgs.length) return null;
  const [top, ...rest] = msgs, chipped = new Set(['pressure', 'thermal'].filter(k => k !== chipOf(top.id)));
  const more = rest.filter(m => !chipped.has(chipOf(m.id))).length;
  return { skip: [chipOf(top.id)].filter(Boolean), line: html`<div class="ws-line"><span class="ws-alert ws-grow" data-severity="${top.sev}"><span class="sr-only">${SEV_WORD[top.sev]}: </span>${top.title}</span>${more ? html`<span class="ws-muted">+${more} more</span>` : ''}</div>` };
};
const decodeLine1 = (s, a) => { const r = s.runtime.request; return html`<div class="ws-line">${dot('live')}<span class="ws-model" translate="no">${glanceModel(r.model)}</span><span class="ws-rate">${tps(r.decodeTps)} <small>tok/s</small></span>${a}</div>`; };
const tsRows = rows => html`<dl class="ts-rows">${rows.filter(Boolean).map(([l, value, b, note]) => html`<dt>${l}</dt><dd data-basis="${b}">${value}${b === 'reported' ? '' : html`<small class="basis">${note ?? BASIS[b]}</small>`}</dd>`)}</dl>`;
const WS = {
  decode: { h: 56, cap: 'Decode · 56 px. Glance tier: line 2 is the 15 min sparkline and only chips that say something; the chevron opens Turn stats.', render: () => { const { s, v } = scenario('decode');
    return html`${decodeLine1(s, attrChip(v.attr))}<div class="ws-line">${spark(fx.trend)}${wsChips(s)}${toggle(false)}</div>`; } },
  idle: { h: 56, cap: 'Idle · 56 px. The last reply keeps its label.', render: () => { const { s, last, lastAttr } = scenario('idle');
    return html`<div class="ws-line">${dot('idle')}<span>Idle</span><span class="ws-model" translate="no">${glanceModel(modelOf(s))}</span>${attrChip(lastAttr)}</div>
      <div class="ws-line">${spark(fx.trend, 'sm')}<span class="ws-grow" data-basis="${last.basis}">Last reply <b>${tps(last.decodeTps)}</b> <small>tok/s</small> <small class="basis">${BASIS[last.basis]}</small></span>${toggle(false)}</div>`; } },
  prefill: { h: 56, cap: 'Prefill · 56 px. Progress and the finish time share line 2; the time is oMLX’s own estimate and says so.', render: () => { const { s, v } = scenario('prefill'), r = s.runtime.request;
    return html`<div class="ws-line">${dot('prefill')}<span class="ws-model" translate="no">${glanceModel(r.model)}</span>${attrChip(v.attr)}</div>
      <div class="ws-line"><span class="ws-rate">${pct(r.prefillFraction)} <small>of prompt read</small></span><span class="ws-grow" data-basis="estimate">· ${dur(r.prefillEtaMs)} left <small class="basis">estimate</small></span>${toggle(false)}</div>`; } },
  first: { h: 56, cap: 'First readings · 56 px. No chart until 2 readings; the line says so instead.', render: () => { const { s, v } = scenario('first-readings');
    return html`${decodeLine1(s, attrChip(v.attr))}<div class="ws-line">${spark(fx.trendFresh)}${toggle(false)}</div>`; } },
  alert: { h: 80, cap: 'Alert · 80 px. Line 3 is the most severe alert, coloured by severity; “+N more” skips alerts already shown as chips.', render: () => { const { s, v } = scenario('pressure'), a = alertLine(s);
    return html`${decodeLine1(s, attrChip(v.attr))}<div class="ws-line">${spark(fx.trend)}${wsChips(s, { skip: a.skip })}${toggle(false)}</div>${a.line}`; } },
  withheld: { h: 56, cap: 'Withheld · 56 px. A short “Server-wide” chip; its reason is line 2 (and the chip’s description).', render: () => { const { s, v } = scenario('withheld-chats'), id = uid('why');
    return html`${decodeLine1(s, attrChip(v.attr, id))}<div class="ws-line">${spark(fx.trend, 'sm')}<span class="ws-muted ws-grow" id="${id}">${WITHHOLD[v.attr.reason](v.attr.params)}</span>${wsChips(s)}${toggle(false)}</div>`; } },
  offline: { h: 56, cap: 'Offline · 56 px. One message; the last reply stays in History.', render: () => { const { s } = scenario('offline'), m = statusMsg(s);
    return html`<div class="ws-line">${dot('bad')}<span class="ws-grow"><span class="sr-only">Critical: </span>${m.title}</span><span class="ws-muted">since ${clock(m.since)}</span></div>
      <div class="ws-line"><span class="ws-muted ws-grow">Scope checks again automatically</span></div>`; } },
  recovering: { h: 56, cap: 'Splash recovering · 56 px.', render: () => { const { s } = scenario('splash-recovering'), m = statusMsg(s);
    return html`<div class="ws-line">${dot('warn')}<span class="ws-grow">${m.title}</span><span class="ws-muted">since ${clock(m.since)}</span></div>

  approval: { h: 56, cap: 'Needs approval · 56 px. Nothing is read until approved.', render: () => html`<div class="ws-line">${dot('idle')}<span class="ws-grow">MLX Scope 2.0 needs one approval</span></div>
      <div class="ws-line"><span class="ws-muted ws-grow">Settings → Extensions → MLX Scope</span></div>` },
  armed: { h: 56, cap: 'Next reply armed · 56 px. Cancels if this section closes.', render: () => { const { s, v } = scenario('next-armed');

      <div class="ws-line"><span class="ws-muted ws-grow">Waiting for a message · <b>${mmss(v.next.leftMs)}</b> left</span><button class="ws-btn" type="button">Cancel</button></div>`; } },
  measuring: { h: 56, cap: 'Next reply measuring · 56 px. Line 1 is the measurement; line 2 only its state.', render: () => { const { s, v } = scenario('next-measuring');
    return html`${decodeLine1(s, attrChip(v.attr))}<div class="ws-line"><span class="pulse" aria-hidden="true"></span><span class="ws-muted ws-grow">Measuring next reply · ${dur(v.next.elapsedMs)}</span><button class="ws-btn" type="button">Cancel</button></div>`; } },
  nonlocal: { h: 24, cap: 'Non-local chat · 24 px, whichever view is chosen.', render: () => html`<div class="ws-line">${dot('idle')}<span class="ws-muted ws-grow">Chat uses a non-local model</span></div>` },
  tip: { h: 96, cap: 'One-time tip · 96 px, one dismiss control, remembered in pref.v2.', render: () => { const { s, v } = scenario('decode');
    return html`${decodeLine1(s, attrChip(v.attr))}<div class="connection-diagnosis" data-severity="info" role="note"><span>Replace Turn stats: hide it in Panel sections and drag MLX Scope into its place</span><button class="close" type="button" aria-label="Dismiss tip">${icon('close')}</button></div>`; } },
  firstrun: { h: 80, cap: 'First ledger write from any surface · 80 px.', render: () => { const { s, lastAttr } = scenario('idle');
    return html`<div class="ws-line">${dot('idle')}<span>Idle</span><span class="ws-model" translate="no">${glanceModel(modelOf(s))}</span>${attrChip(lastAttr)}</div>
      <div class="connection-diagnosis" data-severity="info" role="status"><span>Recording reply history locally · <button class="link-btn" type="button">Open Scope to manage</button></span><button class="close" type="button" aria-label="Dismiss">${icon('close')}</button></div>`; } },
  // Turn stats replacement (≤ 200 px): the host's label/value rows, runtime-exact where the runtime reports, a muted basis suffix otherwise.
  turnstats: { h: 184, cap: 'Turn stats · expanded, 184 px. Splash via Bionic reports every row. The chevron switches back to the 56 px glance; the choice is kept in pref.v2.', render: () => {
    const t = fx.panel.turnStats.bionic, s = fx.snapshots.bionic;
    return html`<div class="ts-head">${dot('idle')}<span class="ws-rate">Last turn</span><span class="ws-muted">· ${t.steps} steps</span>${attrChip({ label: 'inferred' })}${toggle(true)}</div>
      ${tsRows([['Response', `${tps(t.wDecodeTps)} tok/s`, 'derived'], ['Turn time', dur(t.wholeMs), 'observed'], ['Model · tool time', `${dur(t.modelMs)} · ${dur(t.waitMs)}`, 'observed'],
        ['First TTFT', dur(t.firstTtftMs), 'reported'], ['Tokens in · out', `${kt(t.promptTokens)} · ${int(t.outputTokens)}`, 'reported'], ['Cache %', pct(t.cachedTokens / t.promptTokens), 'reported'],
        ['Context used', `${kt(t.contextUsedTokens)} of ${kt(t.contextWindowTokens)}`, 'reported'], ['vs usual', `${delta(t.vsUsual.delta)} · n ${t.vsUsual.n}`, 'derived']])}
      <div class="ws-line">${spark(fx.trend, 'wide')}${wsChips(s, { gpu: false })}</div>`; } },
  'turnstats-live': { h: 152, cap: 'Turn stats · a turn in progress (oMLX, step 1 decoding), 152 px. vs usual appears when the turn ends; while prefill runs, Response reads “Reading 64% · about 18 s left”.', render: () => {
    const t = fx.panel.turnStats.live, s = fx.snapshots['omlx-decode'];
    return html`<div class="ts-head">${dot('live')}<span class="ws-rate">This turn</span><span class="ws-muted">· step ${t.step}</span>${attrChip({ label: 'inferred' })}${toggle(true)}</div>
      ${tsRows([['Response now', `${tps(t.decodeTps)} tok/s`, 'reported'], ['Turn time', `${dur(t.wholeMs)} so far`, 'observed'], ['Model · tool time', `${dur(t.modelMs)} · ${dur(t.waitMs)}`, 'observed'],
        ['Tokens in · out', `${kt(t.promptTokens)} · ${int(t.outputTokens)}`, 'reported'], ['Cache %', pct(t.cachedTokens / t.promptTokens), 'reported'], ['Context used', `${kt(t.contextUsedTokens)} of ${kt(t.contextWindowTokens)}`, 'reported']])}
      <div class="ws-line">${spark(fx.trend, 'wide')}${wsChips(s)}</div>`; } },
  'turnstats-withheld': { h: 168, cap: 'Turn stats · last turn withheld (2 chats), 168 px. No turn summary; the slot shows the last reply, server-wide.', render: () => {
    const w = fx.panel.turnStats.withheld, s = fx.snapshots.bionic, c = s.completions.items.find(x => x.seq === w.seq), id = uid('why'), b = fx.panel.bionicBaseline;
    return html`<div class="ts-head">${dot('idle')}<span class="ws-rate">Last reply</span>${attrChip({ label: 'withheld', reason: w.reason, params: w.params }, id)}${toggle(true)}</div>
      <div class="ts-reason" id="${id}">${WITHHOLD[w.reason](w.params)} · no turn summary</div>

        ['Cache %', pct(c.cachedTokens / c.promptTokens), 'reported'], ['Context used', `${kt(c.promptTokens + c.outputTokens)} of 262K`, 'reported'], ['vs usual', `${delta((c.decodeTps - b.decode.p50) / b.decode.p50)} · n ${b.decode.n}`, 'derived']])}

  'turnstats-omlx': { h: 168, cap: 'Turn stats · oMLX, 168 px. oMLX doesn’t report TTFT, so that row is left out; token counts are Scope’s last readings.', render: () => {
    const t = fx.panel.turnStats.omlx, s = fx.snapshots['omlx-idle'];
    return html`<div class="ts-head">${dot('idle')}<span class="ws-rate">Last turn</span><span class="ws-muted">· ${t.steps} steps</span>${attrChip({ label: 'inferred' })}${toggle(true)}</div>
      ${tsRows([['Response', `${tps(t.wDecodeTps)} tok/s`, 'derived'], ['Turn time', dur(t.wholeMs), 'observed'], ['Model · tool time', `${dur(t.modelMs)} · ${dur(t.waitMs)}`, 'observed'],
        ['Tokens in · out', `${kt(t.promptTokens)} · ${int(t.outputTokens)}`, 'last-observed'], ['Cache %', pct(t.cachedTokens / t.promptTokens), 'last-observed'],
        ['Context used', `${kt(t.contextUsedTokens)} of ${kt(t.contextWindowTokens)}`, 'last-observed'], ['vs usual', `${delta(t.vsUsual.delta)} · n ${t.vsUsual.n}`, 'derived']])}

};
const GLANCE_ORDER = ['decode', 'idle', 'prefill', 'first', 'alert', 'withheld', 'measuring', 'armed', 'offline', 'recovering', 'approval', 'nonlocal', 'tip', 'firstrun'];
const TURN_ORDER = ['turnstats', 'turnstats-live', 'turnstats-withheld', 'turnstats-omlx'];
const wsShot = (id, headRight) => html`<div class="ws-shot" data-ws="${id}"><div class="ws-head"><span>MLX Scope</span><span>${headRight ?? `setHeight(${WS[id].h})`}</span></div><div class="ws" data-variant="${id}" style="height:${WS[id].h}px">${WS[id].render()}</div></div>`;
// Rail Compact (view.compact): the same glance at panel width, ≤ 160 px tall.
const compactRail = sc => {

/* ---------- review board ---------- */

  return html`<figure><figcaption>${caption}</figcaption><iframe title="${caption}" src="?${qs}" data-key="?${qs}" width="${width}" height="${height}" loading="lazy"></iframe></figure>`; };
const LIVE_STATES = ['withheld-chats', 'withheld-subagent', 'other-provider', 'armed-refusal', 'first-readings', 'prefill', 'prefill-stall', 'paused', 'next-armed', 'next-measuring', 'next-result',

    ['Chip power', 'Chip power (CPU+GPU+ANE, macmon estimate) · includes all apps · not wall power.'], ['tok/J', 'Tokens per joule, which is tok/s per watt; one name everywhere. Only while one request decodes, labelled estimate.'],

  const theOther = theme === 'dark' ? 'light' : 'dark';
  return html`<div class="board"><header><h1>MLX Scope 2.0 · G2 mock</h1><a class="btn" href="?${new URLSearchParams({ theme: theOther })}">Switch to ${theOther}</a></header>
    <p>Static and self-contained. Real 1.6 tokens (panel/style.css), 1.6 cards, hero, callout and segmented tabs; synthetic v2 fixtures (2.0-mock-fixtures.json, contract in 2.0-contract.md). Every value that isn’t reported by its source carries its basis; attribution always says inferred or armed, and server-wide always says why; GPU memory is never called video memory; nothing alerts on the GPU; a chart line exists only where there are readings.</p>
    <section><h2>Rail panel · four tabs</h2><p>Decode, this chat · inferred. Mac details is collapsed by default, as in 1.6.</p>

    <section><h2>Interaction and accessibility (Stage 8 builds these)</h2><ul class="spec">

    <section><h2>ⓘ, label and status copy</h2><table class="copy-table">${copy.map(([k, v]) => html`<tr><th>${k}</th><td>${v}</td></tr>`)}</table></section>
    <section><h2>Other decisions for the owner</h2><ul class="defaults">
